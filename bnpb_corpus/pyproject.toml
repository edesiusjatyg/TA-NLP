[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bnpb-qa-corpus"
version = "0.1.1"
description = "Korpus bersama QA klasik dan RAG dari salinan buku saku BNPB"
requires-python = ">=3.10"
dependencies = ["PyMuPDF==1.26.6"]

[project.scripts]
bnpb-corpus = "bnpb_corpus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
